<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Marco Marcello Hugo</title>
  <desc id="description">Informatics at ITS. Exploring web, mobile, and cloud. A deep navy banner with blue, violet, teal, and amber accents and an illustration of connected layers.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#95A7E0" stroke-opacity=".1"/>
    </pattern>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101E35"/>
      <stop offset=".55" stop-color="#181C38"/>
      <stop offset="1" stop-color="#102C35"/>
    </linearGradient>
    <linearGradient id="accent" x1="56" y1="0" x2="1224" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7AA2FF"/>
      <stop offset=".4" stop-color="#B5A0FF"/>
      <stop offset=".75" stop-color="#6EE7CF"/>
      <stop offset="1" stop-color="#F3C878"/>
    </linearGradient>
    <linearGradient id="name" x1="52" y1="220" x2="280" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8CBBFF"/>
      <stop offset="1" stop-color="#C0A8FF"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop stop-color="#426BBF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#426BBF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop stop-color="#8B5FD3" stop-opacity=".24"/>
      <stop offset="1" stop-color="#8B5FD3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#214B4B"/>
      <stop offset="1" stop-color="#182D48"/>
    </linearGradient>
    <clipPath id="bounds">
      <rect width="1280" height="440" rx="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1280" height="440" fill="url(#background)"/>
    <circle cx="430" cy="40" r="380" fill="url(#blueGlow)"/>
    <circle cx="1030" cy="210" r="360" fill="url(#violetGlow)"/>
    <rect width="1280" height="5" fill="url(#accent)"/>
    <rect x="768" width="512" height="440" fill="url(#grid)"/>
    <path d="M768 0V440" stroke="#7AA2FF" stroke-opacity=".12"/>
    <circle cx="1210" cy="50" r="230" stroke="#B5A0FF" stroke-opacity=".16"/>
    <circle cx="1210" cy="50" r="290" stroke="#7AA2FF" stroke-opacity=".12"/>

    <rect x="56" y="44" width="38" height="38" rx="10" fill="#A7BAFF"/>
    <path d="m66 56 6 7-6 7m11 0h7" stroke="#182540" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="69" fill="#B1BFDC" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2">MARCELLOHUGO</text>

    <g fill="#F3F7FA" font-family="'Segoe UI', Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-3">
      <text x="52" y="178">Marco Marcello</text>
      <text x="52" y="261" fill="url(#name)">Hugo<tspan fill="#F3C878">.</tspan></text>
    </g>
    <text x="56" y="309" fill="#AFBDD4" font-family="'Segoe UI', Arial, sans-serif" font-size="22">Exploring <tspan fill="#8CBBFF">web</tspan>, <tspan fill="#C0A8FF">mobile</tspan>, and <tspan fill="#6EE7CF">cloud</tspan>.</text>

    <g transform="translate(1012 182)" stroke-linejoin="round">
      <ellipse cy="96" rx="168" ry="54" stroke="#7AA2FF" stroke-opacity=".35" stroke-dasharray="4 8"/>
      <path d="m0 4 144 76L0 156-144 80Z" fill="#172C4A" stroke="#7AA2FF" stroke-width="1.5"/>
      <path d="M-144 80v14L0 170l144-76V80M0 156v14" stroke="#7AA2FF" stroke-width="1.5"/>
      <path d="M-144 24v56M144 24v56M0 100v56" stroke="#7AA2FF" stroke-opacity=".55" stroke-dasharray="4 6"/>
      <path d="m0-52 144 76L0 100-144 24Z" fill="#2D284F" stroke="#B5A0FF" stroke-width="1.5"/>
      <path d="M-144 24v14L0 114l144-76V24M0 100v14" stroke="#B5A0FF" stroke-width="1.5"/>
      <path d="M-144-32v56M144-32v56M0 44v56" stroke="#B5A0FF" stroke-opacity=".6" stroke-dasharray="4 6"/>
      <path d="m0-108 144 76L0 44-144-32Z" fill="url(#surface)" stroke="#6EE7CF" stroke-width="2"/>
      <path d="M-144-32v14L0 58l144-76v-14M0 44v14" stroke="#6EE7CF" stroke-width="2"/>
      <path d="m-35-40-22 12 22 12m70-24 22 12-22 12m-24 5L14-48" stroke="#96F1DE" stroke-width="4" stroke-linecap="round"/>
      <circle cx="144" cy="-32" r="5" fill="#F3C878"/>
      <path d="M144-32h34v-60" stroke="#F3C878" stroke-opacity=".7"/>
      <circle cx="178" cy="-96" r="4" fill="#182039" stroke="#F3C878" stroke-width="1.5"/>
      <path d="M-144 80h-30v-150" stroke="#7AA2FF" stroke-opacity=".75"/>
      <circle cx="-174" cy="-74" r="4" fill="#7AA2FF"/>
    </g>

    <path d="M56 361H1224" stroke="url(#accent)" stroke-opacity=".4"/>
    <circle cx="62" cy="396" r="4" fill="#F3C878"/>
    <text x="78" y="401" fill="#B7C7D2" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.6">INFORMATICS @ ITS</text>
    <text x="1224" y="401" text-anchor="end" fill="#9BAEBE" font-family="'Segoe UI', Arial, sans-serif" font-size="13" letter-spacing="1.6">SURABAYA, INDONESIA</text>
  </g>
</svg>
